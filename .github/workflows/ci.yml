name: CI

on:
  push:
    branches: [main, acr/**]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20.19.0', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Before lint and typecheck: the packages import each other through their built
      # `dist/*.d.ts`, so in a fresh checkout every cross-package type is unresolved and
      # the type-aware lint rules fail on it.
      - name: Build
        run: npm run build

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run hermetic test suite
        run: npm test

      - name: Pack smoke test
        run: |
          npm pack
          TARBALL=$(ls agent-chat-room-*.tgz | head -n 1)
          TARBALL_PATH="$(pwd)/$TARBALL"
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init -y
          npm install "$TARBALL_PATH"
          ./node_modules/.bin/acr --version
          DOCTOR_OUT=$(./node_modules/.bin/acr doctor --json || true)
          echo "$DOCTOR_OUT" | grep '"runtimes"'
          ./node_modules/.bin/acr serve --port 4399 --no-open &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 10); do
            if curl -s http://127.0.0.1:4399/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -f -s http://127.0.0.1:4399/api/health
          curl -f -s http://127.0.0.1:4399/ | grep -i "<html"
          kill $SERVER_PID 2>/dev/null || true
